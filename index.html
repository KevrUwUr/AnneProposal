<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>¿Quieres ser mi novia?</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="min-h-dvh bg-slate-950 text-white">
    <section
      class="hero-shell relative flex min-h-dvh items-center justify-center p-3 sm:p-4 md:p-8"
    >
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <div
        class="proposal-card w-full max-w-3xl rounded-[2rem] border border-white/10 bg-white/10 p-4 shadow-2xl backdrop-blur-xl sm:p-6 md:p-10"
      >
        <div class="mb-5 text-center md:mb-6">
          <p
            class="mb-3 text-xs uppercase tracking-[0.35em] text-rose-200/80 sm:text-sm"
          >
            Una pregunta importante
          </p>

          <h1
            class="font-display text-2xl font-bold leading-tight text-white sm:text-4xl md:text-6xl"
          >
            ¿Quieres ser mi novia?
          </h1>

          <p
            class="mx-auto mt-3 max-w-2xl text-xs leading-5 text-slate-200/90 sm:mt-4 sm:text-base sm:leading-6"
          >
            Prometo hacerte sonreír, cuidarte mucho y convertir este momento en
            un recuerdo bonito.
          </p>
        </div>

        <div
          class="mb-5 grid gap-3 md:mb-8 md:grid-cols-2 md:gap-4"
        >
          <div
            class="rounded-3xl border border-white/10 bg-white/5 p-4 text-center"
          >
            <p
              class="text-xs uppercase tracking-[0.3em] text-rose-100/70 sm:text-sm"
            >
              Respuesta correcta
            </p>

            <p class="mt-2 text-base text-slate-100 sm:text-lg">
              Elige con el corazón
            </p>
          </div>

          <div
            class="rounded-3xl border border-white/10 bg-white/5 p-4 text-center"
          >
            <p
              class="text-xs uppercase tracking-[0.3em] text-rose-100/70 sm:text-sm"
            >
              Modo aburrido
            </p>

            <p class="mt-2 text-base text-slate-100 sm:text-lg">
              ¿Por qué darías no?
            </p>
          </div>
        </div>

        <div
          id="playArea"
          class="relative overflow-hidden rounded-[1.75rem] border border-white/10 bg-slate-900/40 p-4 sm:p-6"
        >
          <div
            class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(244,114,182,0.18),transparent_55%)]"
          ></div>

          <div class="relative z-10">
            <div
              id="movementZone"
              class="relative mx-auto h-[220px] w-full sm:h-[260px] md:h-[300px]"
            >
              <button
                id="yesBtn"
                class="yes-btn absolute rounded-full bg-emerald-400 px-6 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-emerald-500/30 transition-transform duration-300 sm:px-8 sm:py-4 sm:text-lg"
              >
                Sí
              </button>

              <button
                id="noBtn"
                class="no-btn absolute rounded-full bg-rose-500 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-rose-500/30 transition-all duration-200 sm:px-8 sm:py-4 sm:text-lg"
              >
                No
              </button>
            </div>

            <p
              id="message"
              class="mt-4 text-center text-sm text-slate-200/85 sm:text-base"
            >
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
